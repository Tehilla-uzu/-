<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My URL Shortener</title>
</head>
<body>
    <h1>My URL Shortener</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="url" name="original_url"
               placeholder="Paste your long URL here" required>
        <button type="submit">Shorten URL</button>
    </form>

    {% if short_link %}
        <p>Your short link:</p>
        <a href="{{ short_link }}">{{ short_link }}</a>
        {% endif %}
    </body>
    </html>
